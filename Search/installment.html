<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Import a clean, professional font */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

body {
    font-family: 'Inter', sans-serif;
    background-color: #f9fafb;
    padding: 2rem;
    color: #1f2937;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

thead {
    background-color: #f3f4f6;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
}

th {
    padding: 12px 24px;
    text-align: left;
    font-weight: 600;
    color: #4b5563;
    border-bottom: 2px solid #e5e7eb;
}

td {
    padding: 16px 24px;
    border-bottom: 1px solid #f3f4f6;
    vertical-align: middle;
}

/* Styling for the Order Information column */
.order-info {
    font-weight: 500;
    color: #111827;
    background-color: #ffffff;
}

/* Numeric alignment and formatting */
.numeric {
    font-family: 'Courier New', monospace; /* Keeps numbers aligned */
    text-align: right;
    font-weight: 500;
}

/* Status Badges */
.status-badge {
    padding: 4px 12px;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
}

.status-pending {
    background-color: #fef3c7;
    color: #92400e;
}

/* Hover effect for rows */
tbody tr:hover {
    background-color: #f9fafb;
}
    </style>
</head>
<body>
    <table>
    <thead>
        <tr>
            <th scope="col">Order & Customer</th>
            <th scope="col">Due Date</th>
            <th scope="col">Installment Amount</th>
            <th scope="col">Amount Paid</th>
            <th scope="col">Line Status</th>
            <th scope="col">Order Status</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td rowspan="4" class="order-info">
                <strong>JAH-202603180002</strong><br>
                <span>Jonathan Adiyasa</span>
            </td>
            <td>2026-03-31</td>
            <td class="numeric">$833.33</td>
            <td class="numeric">$0.00</td>
            <td><span class="badge badge-pending">Unpaid</span></td>
            <td rowspan="4" class="status-summary">Pending</td>
        </tr>
        <tr>
            <td>2026-04-30</td> <td class="numeric">$833.33</td>
            <td class="numeric">$0.00</td>
            <td><span class="badge badge-pending">Unpaid</span></td>
        </tr>
        <tr>
            <td>2026-04-30</td> <td class="numeric">$833.33</td>
            <td class="numeric">$0.00</td>
            <td><span class="badge badge-pending">Unpaid</span></td>
        </tr>
        <tr>
            <td>2026-04-30</td> <td class="numeric">$833.33</td>
            <td class="numeric">$0.00</td>
            <td><span class="badge badge-pending">Unpaid</span></td>
        </tr>
        </tbody>
</table>
</body>
</html>
