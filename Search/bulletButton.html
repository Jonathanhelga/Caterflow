<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .status-toggle {
            display: flex;
            gap: 10px;
        }

        /* Hide the actual radio circle */
        .status-toggle input[type="radio"] {
            display: none;
        }

        /* Style the labels as buttons */
        .status-toggle label {
            padding: 8px 16px;
            border: 2px solid #ccc;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Change style when the hidden radio is checked */
        #pending:checked + label { background-color: #ffc107; border-color: #ffc107; color: #000; }
        #paid:checked + label { background-color: #28a745; border-color: #28a745; color: #fff; }
        #overdue:checked + label { background-color: #dc3545; border-color: #dc3545; color: #fff; }
    </style>
</head>
<body>
    <div class="status-toggle">
        <input type="radio" id="pending" name="status" value="pending" checked>
        <label for="pending">Pending</label>

        <input type="radio" id="paid" name="status" value="paid">
        <label for="paid">Paid</label>

        <input type="radio" id="overdue" name="status" value="overdue">
        <label for="overdue">Overdue</label>
    </div>
</body>
</html>
